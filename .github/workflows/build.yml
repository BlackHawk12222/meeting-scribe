# Builds Scribe.app on a GitHub-hosted Apple Silicon Mac, checks it, and uploads the .zip/.dmg.
# Add "[release]" to a commit message to also publish a GitHub Release.
# Tests (0.7.2): no useless tests. A push runs NO long self-test by default:
#   • the app-icon check (assetutil, seconds) always runs;
#   • the "targeted" self-test (only what the release changed, a few minutes) runs when the push
#     touches the engine, dictation, storage or self-test code;
#   • "[selftest:quick]" / "[selftest:full]" / "[selftest:none]" in the commit message overrides it.
#   The dictation engine benchmark (voicebench) never runs on a push.
# Updates are served from this repo's releases (no separate mirror repo).
name: build-mac-app
on:
  push:
    branches: [main]
    paths: ["Sources/**", "Resources/SelfTest/**", "Tests/**", "project.yml", "scripts/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      selftest:
        description: "Self-test suite: targeted (what changed), quick, full, noisy, or none"
        default: "none"
      snapshots:
        description: "Also render the UI screenshots (light + dark) as an artifact"
        default: "false"
      release:
        description: "Publish a release"
        default: "false"
      compare_models:
        description: "Also measure Parakeet Ultra vs v2 (downloads ~630 MB)"
        default: "false"
      noisy_args:
        description: "Extra arguments for the noisy suite, e.g. --variants overlap,gate --snrs 5,0"
        default: ""
      voicebench:
        description: "Also run the dictation engine benchmark (Parakeet v2/v3, Whisper turbo/distil; ~1 h, downloads ~1.7 GB)"
        default: "false"
      voicebench_engines:
        description: "Voice benchmark engines: all, or a comma list (parakeet-v2,parakeet-v3,…)"
        default: "all"
permissions:
  contents: write
concurrency:
  # One group per branch, so a dev-branch run never cancels a main/release build.
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: ${{ github.event.inputs.voicebench == 'true' && 130 || 110 }}
    steps:
      - uses: actions/checkout@v4
      - name: Pick Xcode (newest 26.x if installed, for the Apple Intelligence SDK)
        run: |
          ls -d /Applications/Xcode*.app || true
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -z "$X" ] && X=/Applications/Xcode_16.4.app
          sudo xcode-select -s "$X"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ hashFiles('project.yml') }}
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Read version
        # VERSION (repo root) holds the app version, e.g. 0.7.1. Bump it before each [release].
        run: |
          V="$(tr -d ' \n' < VERSION 2>/dev/null || true)"
          [ -n "$V" ] || V="0.5.${{ github.run_number }}"
          echo "SCRIBE_VERSION=$V" >> "$GITHUB_ENV"
          echo "Version: $V"
      - name: Pick the self-test suite (no useless tests)
        env:
          MSG: ${{ github.event.head_commit.message }}
          BEFORE: ${{ github.event.before }}
          INPUT: ${{ github.event.inputs.selftest }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SUITE="${INPUT:-none}"
          else
            SUITE=none
            FORCED=$(printf '%s' "$MSG" | grep -oE '\[selftest:[a-z]+\]' | head -1 | sed 's/\[selftest:\(.*\)\]/\1/' || true)
            if [ -n "$FORCED" ]; then SUITE="$FORCED"
            else
              git fetch --no-tags --depth=50 origin "$BEFORE" 2>/dev/null || true
              CHANGED=$(git diff --name-only "$BEFORE" HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
              echo "Changed files:"; echo "$CHANGED"
              if echo "$CHANGED" | grep -qE '^Sources/Scribe/(Engine|Dictation|Storage|SelfTest)/'; then SUITE=targeted; fi
            fi
          fi
          [ "$SUITE" = "voicebench" ] && SUITE=none
          echo "SCRIBE_SUITE=$SUITE" >> "$GITHUB_ENV"
          echo "Self-test suite: $SUITE"
      - name: Build, sign (ad-hoc), package
        env:
          SCRIBE_BUILD: ${{ github.run_number }}
          # Optional stable signing identity (README → Signing). Empty = ad-hoc.
          # Dev-branch test builds (release=false, not main) stay ad-hoc signed and skip the cert.
          SIGNING_CERT_P12: ${{ (github.ref == 'refs/heads/main' || github.event.inputs.release == 'true') && secrets.SIGNING_CERT_P12 || '' }}
          SIGNING_CERT_PASSWORD: ${{ (github.ref == 'refs/heads/main' || github.event.inputs.release == 'true') && secrets.SIGNING_CERT_PASSWORD || '' }}
        run: ./scripts/build.sh
      - name: App icon check (Light / Dark / Tinted looks in Assets.car)
        run: |
          APP=build/DD/Build/Products/Release/Scribe.app
          xcrun assetutil --info "$APP/Contents/Resources/Assets.car" > assetinfo.json
          python3 - <<'PY'
          import json, sys
          info = json.load(open("assetinfo.json"))
          rows = [r for r in info if isinstance(r, dict) and "AppIcon" in str(r.get("Name", ""))]
          looks = {}
          for r in rows:
              key = (r.get("AssetType"), r.get("Appearance", "any"), r.get("Idiom"))
              looks[key] = looks.get(key, 0) + 1
          for k, v in sorted(looks.items(), key=str):
              print("AppIcon rendition:", k, "x", v)
          apps = {str(r.get("Appearance", "")) for r in rows}
          print("Appearances:", sorted(apps))
          has_dark = any("Dark" in a for a in apps)
          has_tint = any("Tint" in a or "Mono" in a for a in apps)
          print("ICON_CHECK dark=%s tinted=%s renditions=%d" % (has_dark, has_tint, len(rows)))
          if not rows or not has_dark:
              print("::error::Assets.car has no dark AppIcon look"); sys.exit(1)
          PY
          ls -la "$APP/Contents/Resources" | grep -i -E "icns|car" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" "$APP/Contents/Info.plist" || true
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          retention-days: 5
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Scribe
          path: |
            dist/Scribe.zip
            dist/Scribe.dmg
            dist/Scribe.zip.sha256
          retention-days: 30
      - name: Cache models (the app is not sandboxed, so FluidAudio uses ~/Library/Application Support)
        if: env.SCRIBE_SUITE != 'none'
        uses: actions/cache@v4
        with:
          path: ~/Library/Application Support/FluidAudio
          key: models-fluidaudio-0.18.3-unsandboxed-v2-${{ github.event.inputs.selftest == 'noisy' && 'noisy' || (github.event.inputs.compare_models == 'true' && 'ultra' || 'base') }}
          restore-keys: |
            models-fluidaudio-0.18.3-unsandboxed-
      - name: Self-test (dictation clip + AMI meeting, real models, this runner's CPU/GPU)
        if: env.SCRIBE_SUITE != 'none'
        timeout-minutes: 85
        run: |
          set -o pipefail
          # If it crashes, the Swift runtime prints a symbolicated backtrace to stderr.
          BT=$(xcrun --find swift-backtrace 2>/dev/null || find "$(xcode-select -p)" -name swift-backtrace -type f 2>/dev/null | head -1 || true)
          export SWIFT_BACKTRACE="enable=yes,interactive=no,symbolicate=full${BT:+,swift-backtrace=$BT}"
          echo "SWIFT_BACKTRACE=$SWIFT_BACKTRACE"
          SUITE="$SCRIBE_SUITE"
          EXTRA=""; [ "${{ github.event.inputs.compare_models }}" = "true" ] && EXTRA="--compare-models"
          ./build/DD/Build/Products/Release/Scribe.app/Contents/MacOS/Scribe --selftest --suite "$SUITE" --seconds 300 --meeting-wav "$PWD/Tests/ES2004a_first300s.wav" --libri-dir "$PWD/Tests/librispeech" --noise-wav "$PWD/Tests/noise/crowd_noise_16k.wav" $EXTRA ${{ github.event.inputs.noisy_args }} --measure-download | tee selftest.out
          grep '^SELFTEST_JSON:' selftest.out | sed 's/^SELFTEST_JSON://' > selftest.json
          python3 -m json.tool selftest.json
          sysctl -n machdep.cpu.brand_string >> selftest-machine.txt; sysctl -n hw.memsize >> selftest-machine.txt
          sw_vers >> selftest-machine.txt; xcodebuild -version >> selftest-machine.txt
      - name: Crash reports (if the self-test crashed)
        if: failure()
        run: |
          ls -la ~/Library/Logs/DiagnosticReports/ /Library/Logs/DiagnosticReports/ 2>/dev/null || true
          for f in ~/Library/Logs/DiagnosticReports/Scribe* /Library/Logs/DiagnosticReports/Scribe*; do
            [ -f "$f" ] || continue; echo "=== $f"; head -c 60000 "$f"; cp "$f" . ; done
      - name: UI screenshots (light + dark, quick set)
        if: github.event.inputs.snapshots == 'true'
        timeout-minutes: 10
        run: |
          mkdir -p shots
          ./build/DD/Build/Products/Release/Scribe.app/Contents/MacOS/Scribe --snapshot --quick --out "$PWD/shots" 2>&1 | tee shots/snapshot.log || true
      - name: Upload screenshots
        if: github.event.inputs.snapshots == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore
          retention-days: 10
      - name: Upload self-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest
          path: |
            selftest.json
            selftest.out
            selftest-machine.txt
            assetinfo.json
            Scribe*.ips
          if-no-files-found: ignore
      - name: Voice benchmark (dictation engines; GitHub runner = virtual M1, no Neural Engine)
        if: always() && github.event_name == 'workflow_dispatch' && github.event.inputs.voicebench == 'true'
        timeout-minutes: 75
        run: |
          set -o pipefail
          ./build/DD/Build/Products/Release/Scribe.app/Contents/MacOS/Scribe --selftest --suite voicebench \
            --libri-dir "$PWD/Tests/librispeech" --noise-wav "$PWD/Tests/noise/crowd_noise_16k.wav" --budget-minutes 62 \
            --engines "${{ github.event.inputs.voicebench_engines || 'all' }}" | tee voicebench.out
          grep '^SELFTEST_JSON:' voicebench.out | sed 's/^SELFTEST_JSON://' > voicebench.json
          grep '^VOICEBENCH_ROWS:' voicebench.out | sed 's/^VOICEBENCH_ROWS://' > voicebench-rows.jsonl
          python3 -m json.tool voicebench.json > /dev/null && echo "voicebench.json OK"
      - name: Upload voice benchmark
        if: always() && github.event.inputs.voicebench == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: voicebench
          path: |
            voicebench.out
            voicebench.json
            voicebench-rows.jsonl
          if-no-files-found: ignore
      - name: Publish release
        if: contains(github.event.head_commit.message, '[release]') || github.event.inputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$SCRIBE_VERSION"
          # components.json = the model manifest; the in-app updater compares it with installed models.
          cp Resources/ModelManifest.json dist/components.json
          cat > release-notes.md <<'EOF'
          Free, on-device dictation + meeting notes for Apple Silicon Macs (macOS 14+, 15+ recommended; Apple Intelligence features need macOS 26). Not notarized. First launch: open it once, then System Settings > Privacy & Security > Open Anyway (macOS 15+). The welcome window downloads the models (~490 MB, once) while you allow Microphone and Accessibility. After updating from an older build: System Settings > Privacy & Security > Accessibility > remove Scribe (–) and add it again (+).
          EOF
          gh release create "$TAG" dist/Scribe.dmg dist/Scribe.zip dist/Scribe.zip.sha256 dist/SHA256SUMS.txt dist/components.json \
            --title "Scribe $TAG" --notes-file release-notes.md
