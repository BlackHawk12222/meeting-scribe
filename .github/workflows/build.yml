# Builds Scribe.app on a GitHub-hosted Apple Silicon Mac, runs a headless
# self-test, and uploads the .zip/.dmg. Add "[release]" to a commit message to
# also publish a GitHub Release.
# Private repo: macOS minutes count 10x, so the push build runs the QUICK self-test.
name: build-mac-app
on:
  push:
    branches: [main]
    paths: ["Sources/**", "Resources/SelfTest/**", "Tests/**", "project.yml", "scripts/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      selftest:
        description: "Self-test suite: quick, full, or none"
        default: "quick"
      release:
        description: "Publish a release"
        default: "false"
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Pick Xcode (newest 26.x if installed, for the Apple Intelligence SDK)
        run: |
          ls -d /Applications/Xcode*.app || true
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -z "$X" ] && X=/Applications/Xcode_16.4.app
          sudo xcode-select -s "$X"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ hashFiles('project.yml') }}
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build, sign (ad-hoc), package
        env:
          SCRIBE_VERSION: 0.3.${{ github.run_number }}
          SCRIBE_BUILD: ${{ github.run_number }}
        run: ./scripts/build.sh
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          retention-days: 5
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Scribe
          path: |
            dist/Scribe.zip
            dist/Scribe.dmg
          retention-days: 30
      - name: Cache models (the app is not sandboxed, so FluidAudio uses ~/Library/Application Support)
        if: github.event_name == 'push' || github.event.inputs.selftest != 'none'
        uses: actions/cache@v4
        with:
          path: ~/Library/Application Support/FluidAudio
          key: models-fluidaudio-0.18.3-unsandboxed-v1
      - name: Self-test (dictation clip + AMI meeting, real models, this runner's CPU/GPU)
        if: github.event_name == 'push' || github.event.inputs.selftest != 'none'
        timeout-minutes: 25
        run: |
          set -o pipefail
          # If it crashes, the Swift runtime prints a symbolicated backtrace to stderr.
          BT=$(xcrun --find swift-backtrace 2>/dev/null || find "$(xcode-select -p)" -name swift-backtrace -type f 2>/dev/null | head -1 || true)
          export SWIFT_BACKTRACE="enable=yes,interactive=no,symbolicate=full${BT:+,swift-backtrace=$BT}"
          echo "SWIFT_BACKTRACE=$SWIFT_BACKTRACE"
          SUITE="${{ github.event.inputs.selftest }}"; [ -z "$SUITE" ] && SUITE=quick
          ./build/DD/Build/Products/Release/Scribe.app/Contents/MacOS/Scribe --selftest --suite "$SUITE" --seconds 300 --meeting-wav "$PWD/Tests/ES2004a_first300s.wav" --measure-download | tee selftest.out
          grep '^SELFTEST_JSON:' selftest.out | sed 's/^SELFTEST_JSON://' > selftest.json
          python3 -m json.tool selftest.json
          sysctl -n machdep.cpu.brand_string >> selftest-machine.txt; sysctl -n hw.memsize >> selftest-machine.txt
          sw_vers >> selftest-machine.txt; xcodebuild -version >> selftest-machine.txt
      - name: Crash reports (if the self-test crashed)
        if: failure()
        run: |
          ls -la ~/Library/Logs/DiagnosticReports/ /Library/Logs/DiagnosticReports/ 2>/dev/null || true
          for f in ~/Library/Logs/DiagnosticReports/Scribe* /Library/Logs/DiagnosticReports/Scribe*; do
            [ -f "$f" ] || continue; echo "=== $f"; head -c 60000 "$f"; cp "$f" . ; done
      - name: Upload self-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest
          path: |
            selftest.json
            selftest.out
            selftest-machine.txt
            Scribe*.ips
          if-no-files-found: ignore
      - name: Publish release
        if: contains(github.event.head_commit.message, '[release]') || github.event.inputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.3.${{ github.run_number }}"
          # components.json = the model manifest; the in-app updater compares it with installed models.
          cp Resources/ModelManifest.json dist/components.json
          gh release create "$TAG" dist/Scribe.dmg dist/Scribe.zip dist/components.json \
            --title "Scribe $TAG" \
            --notes "Free, on-device dictation + meeting notes for Apple Silicon Macs (macOS 14+, 15+ recommended; Apple Intelligence features need macOS 26). Unsigned (ad-hoc) build. First launch: open it once, then System Settings > Privacy & Security > Open Anyway (macOS 15+). The welcome window downloads the models (~490 MB, once) while you allow Microphone and Accessibility."
