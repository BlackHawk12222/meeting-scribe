# UI screenshots: builds Scribe and runs `Scribe --snapshot`, which renders the main
# screens with made-up sample data to PNGs, then uploads them as the "screenshots" artifact.
# Manual only (Actions tab > ui-screenshots > Run workflow), so it never slows down or
# cancels a release build.
name: ui-screenshots
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner image: macos-15, or macos-26 to see Liquid Glass render"
        default: "macos-15"
permissions:
  contents: read
concurrency:
  group: snapshots
  cancel-in-progress: true
jobs:
  snapshots:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Pick Xcode (newest 26.x if installed)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -z "$X" ] && X=/Applications/Xcode_16.4.app
          sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ hashFiles('project.yml') }}
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build
        run: ./scripts/build.sh
      - name: Render screenshots
        timeout-minutes: 5
        run: |
          mkdir -p shots
          ./build/DD/Build/Products/Release/Scribe.app/Contents/MacOS/Scribe --snapshot --out "$PWD/shots" 2>&1 | tee shots/snapshot.log
          ls -la shots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-xcodebuild-log
          path: build/xcodebuild.log
          retention-days: 5
