# XcodeGen spec: `xcodegen generate` turns this file into Scribe.xcodeproj.
# (Keeping the project as a small text file instead of a giant .xcodeproj makes it easy to read and diff.)
name: Scribe
options:
  bundleIdPrefix: com.blackhawk12222
  deploymentTarget:
    macOS: "14.0"
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.18.3
  # voice-test: optional Whisper dictation engines (Argmax WhisperKit, MIT). Only Engine/WhisperEngine.swift uses it.
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    exactVersion: 1.1.1
targets:
  Scribe:
    type: application
    platform: macOS
    sources:
      - path: Sources/Scribe
      # A 16 s test clip (LibriSpeech, CC-BY 4.0) used by `Scribe --selftest` to test dictation.
      - path: Resources/SelfTest
        buildPhase: resources
      # App icon (0.7 "Night Sky": a lavender capsule sound wave with sparkles on a near-black
      # tile, drawn by scripts/make_icon.py, needs Pillow + numpy) + AccentColor.
      - path: Resources/Assets.xcassets
        buildPhase: resources
      # 0.7.2: the macOS 26 icon with Light / Dark / Tinted+Clear looks (Icon Composer document,
      # drawn by scripts/make_icon_composer.py). Needs Xcode 26 + XcodeGen 2.45.1+. actool builds
      # every look into Assets.car; older macOS keeps the appiconset above.
      - path: Resources/AppIcon.icon
        buildPhase: resources
      # Manrope (variable, 200-800) + its SIL Open Font License, copied as a "Fonts" folder into
      # Contents/Resources (ATSApplicationFontsPath below; ScribeFonts.register() is the fallback).
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
      # 0.7.3.1: Credits & licenses (licenses.json + every full license text), copied as a
      # "Licenses" folder into Contents/Resources. build.sh adds the build's Package.resolved.
      - path: Resources/Licenses
        type: folder
        buildPhase: resources
      # The model manifest: every model file's size + hash (scripts/make_model_manifest.py).
      - path: Resources/ModelManifest.json
        buildPhase: resources
    dependencies:
      - package: FluidAudio
      - package: WhisperKit
        product: WhisperKit
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Scribe
        CFBundleName: Scribe
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Where updates come from: this (public) repo's releases.
        ScribeReleasesURL: https://api.github.com/repos/BlackHawk12222/meeting-scribe/releases/latest
        ATSApplicationFontsPath: Fonts
        CFBundleIconName: AppIcon
        CFBundleIconFile: AppIcon
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Scribe listens while you dictate or record a meeting, and turns it into text on this Mac. Audio never leaves your Mac.
        NSHumanReadableCopyright: Made by BlackHawk12222
    entitlements:
      path: Resources/Scribe.entitlements
      properties:
        # NOT sandboxed on purpose: a sandboxed app is not allowed to send the
        # Cmd-V keystroke into other apps, which is how dictation types for you.
        # Hardened runtime stays on; this one entitlement lets it use the mic.
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blackhawk12222.Scribe
        PRODUCT_NAME: Scribe
        # The app version. CI sets it to 0.5.<build number> so it matches the release tag.
        MARKETING_VERSION: "0.5.0"
        CURRENT_PROJECT_VERSION: "5"
        SWIFT_VERSION: "5.0"
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEAD_CODE_STRIPPING: YES
